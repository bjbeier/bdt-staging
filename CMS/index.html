<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDT Blog Manager</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="../styles.css?v=1.12">
    <link rel="stylesheet" href="cms.css">
    <link rel="icon" type="image/png" href="../images/favicon.png">
</head>

<body>
    <!-- Shared Navigation -->
    <header id="site-header">
        <nav>
            <div class="nav-container" id="navContainer">
                <a href="../index.html" class="logo-wrapper">
                    <img src="../images/logo.webp" alt="Blue Droid Technologies" class="logo">
                </a>
                <ul class="nav-links" id="primary-nav">
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="../business.html">Business</a></li>
                    <li><a href="../recycling.html">Recycling</a></li>
                    <li><a href="../blog.html">Blog</a></li>
                    <li><a href="../index.html#about">About</a></li>
                    <li><a href="../index.html#contact">Contact</a></li>
                </ul>
                <div class="nav-actions" id="navActions">
                    <div class="menu-wrapper">
                        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" style="visibility: hidden;">&#9776;</button>
                        <ul class="overflow-menu" id="overflow-nav"></ul>
                    </div>
                    <a href="tel:5132126714" class="phone-btn">
                        <span class="full">Call or Text &bull; (513) 212-6714</span>
                        <span class="short">(513) 212-6714</span>
                        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></span>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <div class="container" style="padding-top: 2rem;">
        <div class="cms-actions-bar">
            <h2 id="cms-title">Blog Manager</h2>
            <div class="header-actions">
                <button id="btn-settings" class="btn">Settings</button>
                <button id="btn-new-post" class="btn btn-primary">New Post</button>
            </div>
        </div>

        <main id="post-list" class="post-grid">
            <!-- Posts injected here -->
        </main>
    </div>

    <!-- Editor Modal -->
    <div id="editor-modal" class="modal-overlay">
        <div class="modal">
            <h2 id="modal-title" style="margin-bottom:1.5rem">Edit Post</h2>
            <form id="post-form">
                <input type="hidden" id="post-id">
                <div class="form-group">
                    <label class="form-label">Title</label>
                    <input type="text" id="post-title" class="form-input" required>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem">
                    <div class="form-group">
                        <label class="form-label">Slug</label>
                        <input type="text" id="post-slug" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Date</label>
                        <input type="date" id="post-date" class="form-input" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Summary</label>
                    <textarea id="post-summary" class="form-input" style="min-height:80px"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Content (HTML)</label>
                    <textarea id="post-content" class="form-textarea"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Tags (comma separated)</label>
                    <input type="text" id="post-tags" class="form-input">
                </div>
                <div style="display:flex; justify-content:flex-end; gap:1rem">
                    <button type="button" id="btn-close-editor" class="btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal" style="max-width: 500px">
            <h2 style="margin-bottom:1.5rem">GitHub Settings</h2>
            <form id="settings-form">
                <div class="form-group">
                    <label class="form-label">GitHub Username</label>
                    <input type="text" id="setting-owner" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Repository Name</label>
                    <input type="text" id="setting-repo" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Branch</label>
                    <input type="text" id="setting-branch" class="form-input" value="main">
                </div>
                <div class="form-group">
                    <label class="form-label">Personal Access Token</label>
                    <input type="password" id="setting-token" class="form-input" required>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:1rem">
                    <button type="button" id="btn-close-settings" class="btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Config</button>
                </div>
            </form>
        </div>
    </div>

    <div id="status-bar" class="status-bar">
        <span id="status-msg">Success</span>
    </div>

    <script src="../scripts.js" defer></script>
    <script src="cms.js" defer></script>
</body>

</html>
